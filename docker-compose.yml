services:
  pgdatabase:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_food_data:/var/lib/postgresql/data
    networks:
      - default

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - default

  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    user: root
    command: server local
    environment:
      ENV_DATABASE_URL: ${DATABASE_URL}
      ENV_DBT_USER: ${DBT_USER}
      ENV_DBT_PASSWORD: ${DBT_PASSWORD}
      ENV_DBT_DBNAME: ${DBT_DBNAME}
    ports:
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

volumes:
  pg_food_data:
  pgadmin_data:

networks:
  default:
    name: food-price-etl_default
