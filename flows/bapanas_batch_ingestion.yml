id: bapanas_batch_ingestion
namespace: data_engineering.etl
description: "Backfill historis dari dataset Kaggle (statis): ingestion lalu dbt build. Dijalankan manual."

tasks:
  - id: run_etl_container
    type: io.kestra.plugin.docker.Run
    containerImage: food_price_ingestor:v1
    pullPolicy: NEVER
    networkMode: food-price-etl_default
    env:
      DATABASE_URL: "{{ envs.database_url }}"
    commands:
      - sh
      - -c
      - "cd /app && python batch_ingest.py"
    retry:
      type: constant
      interval: PT1M
      maxAttempt: 3

  - id: run_dbt_build
    type: io.kestra.plugin.docker.Run
    containerImage: food_price_dbt:v1
    pullPolicy: NEVER
    networkMode: food-price-etl_default
    env:
      DBT_USER: "{{ envs.dbt_user }}"
      DBT_PASSWORD: "{{ envs.dbt_password }}"
      DBT_DBNAME: "{{ envs.dbt_dbname }}"
    commands:
      - dbt
      - build
      - --project-dir
      - /dbt/bapanas_analytics
